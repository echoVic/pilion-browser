<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="pil-tile-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F4F9"/>
    </linearGradient>
    <linearGradient id="pil-rim-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.09"/>
    </linearGradient>
  </defs>

  <!-- macOS Big Sur / Tahoe 栅格：内容区 824×824，四周留白 100，圆角 186 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#pil-tile-light)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" stroke="url(#pil-rim-light)" stroke-width="6"/>

  <!-- 02 · 几何圆团 P（100×100 基准网格等比放大至 824×824 内） -->
  <g transform="translate(100 100) scale(8.24)">
    <rect x="23" y="21" width="20" height="58" rx="10" fill="#2B62F6"/>
    <circle cx="61" cy="41" r="17.5" fill="#FF644E"/>
    <circle cx="62" cy="70" r="8.5" fill="#FFB830"/>
  </g>
</svg>
