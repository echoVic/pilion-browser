name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Each job asks for what it needs: verify only reads, build uploads to the draft release.
permissions:
  contents: read

# Actions are pinned to a full commit SHA (the tag it resolved to is in the trailing comment), so a
# moved tag cannot change what runs next to the signing secrets. Bump the SHA and comment together.

jobs:
  verify:
    # A tag push does not run CI, so the checks CI runs gate the packages here. The macOS end-to-end
    # run is deliberately not part of the release path: it is slow and depends on the network. CI
    # runs it on every push to main; check that run is green before pushing a tag.
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Require the tag to match package.json
        # A tag that does not match the version would publish packages and an update feed whose
        # version disagrees with the release name.
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version; expected $expected"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      # electron-builder uploads the packages to the draft release.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64 + x64)
            os: macos-15-intel
            args: --mac --arm64 --x64
          - name: Windows (x64)
            # Pinned to the image windows-latest pointed to in November 2026 (actions/runner-images
            # README), so a runner image migration is a deliberate change.
            os: windows-2025
            args: --win --x64
          - name: Linux (x64)
            # Pinned: the build image's glibc sets what the packaged Linux app can run on.
            os: ubuntu-24.04
            args: --linux --x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Native runtimes are built and accepted separately on suitable build machines.
      # A release operator pins this repository's reviewed, versioned bundle and hash.
      # The bundle may leave out a target that runtime/electron/packaging.mjs lists as stock
      # (Windows x64 until it has a native build); that target packages the npm Electron.
      - name: Fetch accepted native Electron runtimes (required)
        shell: bash
        env:
          NATIVE_BUNDLE_URL: ${{ vars.PILION_NATIVE_ELECTRON_BUNDLE_URL }}
          NATIVE_BUNDLE_SHA256: ${{ vars.PILION_NATIVE_ELECTRON_BUNDLE_SHA256 }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { createWriteStream, createReadStream } from 'node:fs';
          import { readFile } from 'node:fs/promises';
          import { Readable } from 'node:stream';
          import { pipeline } from 'node:stream/promises';
          import { join } from 'node:path';
          const lock = JSON.parse(await readFile('runtime/electron/build-lock.json', 'utf8'));
          const expectedUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/native-electron-${lock.electronTag}-${lock.patchSha256.slice(0, 12)}/pilion-native-electron.zip`;
          const url = process.env.NATIVE_BUNDLE_URL;
          const expectedHash = process.env.NATIVE_BUNDLE_SHA256;
          if (url !== expectedUrl || !/^[a-f0-9]{64}$/.test(expectedHash ?? '')) {
            throw Error(`Configure PILION_NATIVE_ELECTRON_BUNDLE_URL=${expectedUrl} and its reviewed PILION_NATIVE_ELECTRON_BUNDLE_SHA256 repository variable. Only a target packaging.mjs lists as stock may package the npm Electron.`);
          }
          const result = await fetch(url);
          if (!result.ok) throw Error(`Native bundle download failed: ${result.status}`);
          const destination = join(process.env.RUNNER_TEMP, 'pilion-native-electron.zip');
          await pipeline(Readable.fromWeb(result.body), createWriteStream(destination));
          const hash = createHash('sha256');
          for await (const chunk of createReadStream(destination)) hash.update(chunk);
          if (hash.digest('hex') !== expectedHash) throw Error('Native bundle SHA-256 mismatch');
          JS
          # The interpreter names the packaging hook uses: python on Windows, python3 elsewhere.
          if [ "$RUNNER_OS" = Windows ]; then python=python; else python=python3; fi
          "$python" - <<'PYTHON'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pilion-native-electron'
          targets = ('darwin-arm64', 'darwin-x64', 'win32-x64', 'linux-x64')
          allowed = {f'{target}/{name}' for target in targets for name in ('dist.zip', 'receipt.json', 'tampermonkey-acceptance.json')}
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'pilion-native-electron.zip') as bundle:
              names = [entry.filename for entry in bundle.infolist() if not entry.is_dir()]
              if len(names) != len(set(names)) or not set(names).issubset(allowed):
                  raise RuntimeError('Unexpected or duplicate native bundle entries')
              for name in names:
                  destination = root / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with bundle.open(name) as source, destination.open('wb') as output:
                      import shutil
                      shutil.copyfileobj(source, output)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PILION_ELECTRON_ARTIFACTS={root}\n')
          PYTHON
      - name: Require macOS signing for published packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            echo "::error::Missing macOS signing credentials: ${missing[*]}"
            exit 1
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Package${{ startsWith(github.ref, 'refs/tags/v') && ' and upload to draft release' || '' }}
        shell: bash
        # The signing secrets are given to this step and the check above only, never written to
        # $GITHUB_ENV, so later steps (upload-artifact) cannot read them. They are empty outside
        # macOS, so the Windows and Linux packagers never see the Apple certificate. electron-builder
        # treats an empty CSC_LINK as a certificate path, so every empty one is unset before the
        # packager starts.
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              unset "$name"
            fi
          done
          node scripts/retry-on-network-error.mjs -- node node_modules/electron-builder/cli.js ${{ matrix.args }} -c.beforePack=./runtime/electron/packaging.mjs -c.concurrency.jobs=1 --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: pilion-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
