appId: com.echovic.pilion
productName: Pilion
copyright: Copyright © 2026 echoVic
directories:
  output: release
  buildResources: build
files:
  - electron-main.cjs
  - dist/**/*
  - dist-renderer/**/*
  - '!**/*.map'
  - '!**/*.d.ts'
  - '!**/*.tsbuildinfo'
asar: true
# pilion-browser skill：「安装到 Agent」从 process.resourcesPath/skills 拷到各 Agent 的 skills 目录。
# 注意：外部 CLI / MCP 都以 ELECTRON_RUN_AS_NODE=1 运行 App 可执行文件；若将来用 @electron/fuses
# 关闭 RunAsNode，`pilion` 命令与外部 MCP 会一起失效。
extraResources:
  - from: skills/pilion-browser
    to: skills/pilion-browser
npmRebuild: false
mac:
  protocols:
    - name: Web site URL
      schemes: [http, https]
      role: Viewer
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
dmg:
  sign: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  maintainer: echoVic <137844255@qq.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
appImage:
  artifactName: ${productName}-linux-${arch}.${ext}
publish:
  provider: github
  owner: echoVic
  repo: pilion-browser
  releaseType: draft
